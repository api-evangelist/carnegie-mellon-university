- date: '2026-08-19'
  rating: 3
  summary: 'Re-profile under the university pipeline. The 2026-06 profile scored CMU 41.1 with agent readiness
    38.9 on eleven tag-split copies of ONE figshare contract for KiltHub — the same document, and the
    same 38.9 fingerprint, shared by the eight top-scoring universities in the catalog. Those ten OpenAPIs
    and twenty derived collection files (every request URL api.figshare.com) were removed, along with
    the figshare-derived scopes, vocabulary, rules and JSON-LD context that inherited the vendor''s operator.
    What replaced them is smaller and genuinely CMU''s. Two of the three institution-operated APIs were
    not in the profile at all: the CERT/CC Vulnerability Notes API, operated by the CERT Division of the
    Software Engineering Institute — an FFRDC operated by Carnegie Mellon — which the cohort audit could
    not see because it lives on cert.org rather than cmu.edu; and the CMU Library Publishing Service,
    a REST API plus a conformant OAI-PMH 2.0 provider self-hosted at 128.2.24.32 inside CMU''s own /16,
    whose Identify response names the repository as Carnegie Mellon University Library Publishing Service.
    Neither publishes an OpenAPI, so both specs in this repo are marked derived and attributed to API
    Evangelist. Domain-standard conformance under the education regime: oai-pmh, shibboleth, saml and
    datacite all institution-operated; lti present but tenant (canvas.cmu.edu CNAMEs to Instructure);
    crossref confirmed absent — CMU is not a Crossref member. Real absences confirmed by probe, not assumed:
    no developer portal, no OpenAPI anywhere, no status page, no deprecation policy, no llms.txt, no security.txt,
    and CMU''s own dining application is a soft-200 Blazor catch-all that returns the SPA shell for a
    deliberate nonsense path. Expect the composite to FALL. That is the correction working.'
