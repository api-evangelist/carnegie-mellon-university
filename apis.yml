apis:
- aid: carnegie-mellon-university:delphi-epidata
  name: Delphi Epidata API
  description: Public, anonymously accessible HTTP/JSON API maintained by the Carnegie Mellon University
    Delphi research group providing real-time and historical epidemiological surveillance data, including
    the COVIDcast endpoint and a range of disease signals (influenza, dengue, norovirus and more). R and
    Python clients are available. Verified returning live JSON at the base URL.
