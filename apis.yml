- FN: Kin Lane
  email: kin@apievangelist.com
x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  generated: '2026-08-19'
  method: probed
  detail: >-
    Seven surfaces were settled by live probe on 2026-08-19 before anything was saved: four
    institution-operated and three tenancies. The operator axis is the whole finding. CMU's
    previous profile scored 41.1 with agent readiness 38.9 — the figshare fingerprint shared by
    the eight top-scoring universities in the catalog — on eleven tag-split copies of one vendor
    contract for KiltHub. Those were removed, along with twenty derived Postman/OpenCollection
    files whose every request URL was api.figshare.com. What replaced them is smaller and real:
    the Delphi Epidata API, the CERT/CC Vulnerability Notes API at the Software Engineering
    Institute, and the Library Publishing Service's REST API and OAI-PMH provider self-hosted at
    128.2.24.32 inside CMU's own /16. The CERT/CC surface is a first-time find for this cohort and
    the cohort audit could not have seen it, because it lives on cert.org rather than cmu.edu.
    Real absences confirmed rather than assumed: api.cmu.edu does not resolve; data.cmu.edu
    redirects to a marketing page; www.cmu.edu/llms.txt and /.well-known/security.txt both 404;
    status.cmu.edu does not resolve; no OpenAPI exists for any CMU surface
    (/epidata/openapi.json, .yaml, /openapi and /swagger.json all 404, and no spec file exists in
    cmu-delphi/delphi-epidata); no deprecation policy exists, demonstrated by
    api.heinz.cmu.edu/courses_api which retired into an HTML page with no notice; and CMU's own
    dining application is a soft-200 Blazor catch-all that returns the SPA shell for a deliberate
    nonsense path, which is why the only dining API is a student organization's. Every OpenAPI,
    schema, ruleset and context in this repo is marked `derived` and attributed to API Evangelist,
    not to Carnegie Mellon University.
  evidence:
  - url: https://api.delphi.cmu.edu/epidata/version
    status: 200
  - url: https://api.delphi.cmu.edu/epidata/fluview/?regions=nat&epiweeks=202001
