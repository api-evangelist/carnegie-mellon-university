apis:
- aid: carnegie-mellon-university:delphi-epidata
  name: Delphi Epidata API
  description: >-
    Public, anonymously accessible HTTP/JSON API operated by the Delphi research group at Carnegie
    Mellon University, serving real-time and historical epidemiological surveillance data —
    COVIDcast indicator signals, CDC FluView influenza-like-illness records, and Delphi's own
    nowcasts and forecasts. Revision-aware: every record carries the issue and lag that describe
    when it was reported versus when it was observed. Verified live on five endpoints 2026-08-19;
    /epidata/version returned 4.1.44. Errors are returned with HTTP 200 and signalled only in the
    body's `result` field.
  humanURL: https://cmu-delphi.github.io/delphi-epidata/
  baseURL: https://api.delphi.cmu.edu/epidata
