- aid: carnegie-mellon-university:kilthub-figshare-tenant
  name: KiltHub Institutional Repository (figshare) — tenant
  description: >-
    KiltHub is Carnegie Mellon's institutional repository for research data and scholarly output.
    The data, the collections and the DOIs are CMU's; the platform, the API and the OAI-PMH
    endpoint are figshare's. kilthub.cmu.edu is a CNAME to FIGSHARE.COM and answers HTTP 202 with
    an empty body to non-browser clients; its records are harvestable only from figshare's own
    shared host at https://api.figshare.com/v2/oai using set=portal_231, whose Identify response
    names the repository as "figshare". Recorded as a tenant relationship, which is what it is.
    The eleven figshare-derived contracts this repo carried until 2026-08-19 —
    altmetric/articles/authors/collections/institutions/oauth/other/profiles/projects/symplectic —
    were the same vendor document split by tag and credited to CMU eleven times over. They have
    been removed; the relationship has not.
  humanURL: https://kilthub.cmu.edu/
  baseURL: https://api.figshare.com/v2
  tags:
  - Institutional Repository
  - Research Data
  - Open Access
  - Tenant
  x-operator: tenant
  x-vendor: figshare
  x-vendor-evidence: >-
    kilthub.cmu.edu CNAME FIGSHARE.COM (dig, 2026-08-19). OAI-PMH Identify at
    https://api.figshare.com/v2/oai returns repositoryName "figshare"; CMU's content is addressed
    as set=portal_231.
  properties:
  - type: Documentation
    url: https://kilthub.cmu.edu/
- aid: carnegie-mellon-university:canvas-lti-tenant
  name: Canvas LTI 1.3 Advantage (Instructure) — tenant
  description: >-
    CMU's learning management system serves an LTI 1.3 / LTI Advantage JWKS at
    canvas.cmu.edu/api/lti/security/jwks, so the LTI standard is genuinely in play in CMU's
    teaching environment. It is recorded as a tenancy rather than a CMU surface because
    canvas.cmu.edu is a CNAME to CMU-VANITY.INSTRUCTURE.COM — the LTI implementation, key rotation
    and contract are Instructure's, running under a CMU vanity hostname. The courses and tool
    deployments behind it are CMU's; the engineering is not. Included because the tenancy is a
    real institutional fact and because it is the only `lti` conformance point on a CMU name.
  humanURL: https://canvas.cmu.edu/
  baseURL: https://canvas.cmu.edu/api/lti
