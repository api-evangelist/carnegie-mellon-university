aid: carnegie-mellon-university
name: Carnegie Mellon University
description: >-
  Carnegie Mellon University is a private research university in Pittsburgh, Pennsylvania, ranked
  49th in the QS World University Rankings. It operates no central developer portal, no API
  gateway and no institution-wide developer program — api.cmu.edu and data.cmu.edu do not exist as
  developer surfaces — but unlike most of this cohort it does genuinely engineer public APIs, in
  three unrelated units that share no identifier, envelope or error model. The Delphi research
  group runs the Delphi Epidata API for real-time epidemiological surveillance; the CERT
  Coordination Center at the Software Engineering Institute runs the Vulnerability Notes API, the
  machine-readable record of coordinated vulnerability disclosure; and University Libraries
  self-hosts the Library Publishing Service, five open-access journals behind a REST API and a
  conformant OAI-PMH 2.0 provider on CMU's own hardware. None of the three publishes an OpenAPI,
  a changelog on the API host, a status page or a deprecation policy, and both research APIs
  return errors with HTTP 200. Everything else that carries CMU's name is a tenancy: KiltHub is
  figshare, Canvas is Instructure, and the eleven figshare-derived contracts this profile held
  until 2026-08-19 were a vendor's engineering credited to the university.
type: Index
