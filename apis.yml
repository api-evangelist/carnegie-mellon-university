apis:
- aid: carnegie-mellon-university:delphi-epidata
  name: Delphi Epidata API
  description: >-
    Public, anonymously accessible HTTP/JSON API maintained by the Carnegie Mellon University Delphi research
    group providing real-time and historical epidemiological surveillance data, including the COVIDcast
    endpoint and a range of disease signals (influenza, dengue, norovirus and more). R and Python clients
    are available. Verified returning live JSON at the base URL.
  humanURL: https://cmu-delphi.github.io/delphi-epidata/
  baseURL: https://api.delphi.cmu.edu/epidata/
  tags:
  - Epidemiology
  - Health Data
  - Research
  - Open Data
  - Public Health
  properties:
  - type: Documentation
    url: https://cmu-delphi.github.io/delphi-epidata/
  - type: GitHub
    url: https://github.com/cmu-delphi/delphi-epidata
- aid: carnegie-mellon-university:web-login-sso
  name: CMU Web Login (Shibboleth SSO)
  description: >-
    Carnegie Mellon's campus-wide single sign-on identity service based on Shibboleth/SAML, used by service
    providers to authenticate authorized users. The identity provider metadata endpoint is publicly reachable.
    This is an authentication service for affiliated service providers rather than an open public data
    API.
  humanURL: >-
    https://www.cmu.edu/computing/services/security/identity-access/authentication/sso-provider.html
  baseURL: https://login.cmu.edu/idp/shibboleth
  tags:
  - Identity
  - Authentication
  - SSO
  - Shibboleth
  - SAML
  properties:
  - type: Documentation
    url: >-
      https://www.cmu.edu/computing/services/security/identity-access/authentication/sso-provider.html
