- aid: carnegie-mellon-university:web-login-sso
  name: CMU Web Login (Shibboleth SSO)
  description: Carnegie Mellon's campus-wide single sign-on identity service based on Shibboleth/SAML,
    used by service providers to authenticate authorized users. The identity provider metadata endpoint
    is publicly reachable. This is an authentication service for affiliated service providers rather than
    an open public data API.
