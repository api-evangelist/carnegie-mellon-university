- aid: carnegie-mellon-university:cmu-eats-scottylabs
  name: CMU Eats API (ScottyLabs) — student-operated
  description: >-
    A public JSON API for Carnegie Mellon dining locations, hours and menus, built and run by
    ScottyLabs, a CMU student organization, at api.cmueats.com. It exists because CMU's own dining
    surface does not: apps.studentaffairs.cmu.edu/dining/conceptinfo is a Blazor Server app whose
    catch-all route returns the SPA shell with HTTP 200 for every path, including deliberate
    nonsense, so there is no institutional JSON endpoint to call. Recorded as `tenant` rather than
    `institution` because the domain is not CMU's and no cmu.edu endorsement of the service was
    found; the data it serves is CMU's, the software is not. The older ScottyLabs host
    dining.apis.scottylabs.org still answers but its payload now instructs callers to migrate.
  humanURL: https://cmueats.com/
  baseURL: https://api.cmueats.com/v2
