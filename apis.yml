- aid: carnegie-mellon-university:library-publishing
  name: CMU Library Publishing Service API + OAI-PMH
  description: >-
    REST API and conformant OAI-PMH 2.0 provider for the Carnegie Mellon University Library
    Publishing Service, the open-access publishing programme run by University Libraries. Exposes
    five journals (Language Development Research, Encyclopedia of the History of Science, MAJAL,
    Negotiation and Conflict Management Research, Tolstoy Studies Journal), their issues, 379
    articles, keywords and preprint objects. Self-hosted at 128.2.24.32 — inside Carnegie Mellon's
    own /16 — so unlike almost every research surface in this cohort it is the institution's own
    machine, not a vendor tenancy. The OAI-PMH Identify response names the repository as Carnegie
    Mellon University Library Publishing Service and the administrator as
    librarypublishing@andrew.cmu.edu, and advertises oai_dc and jats.
  humanURL: https://lps.library.cmu.edu/
  baseURL: https://lps.library.cmu.edu/api
