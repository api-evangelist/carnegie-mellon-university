- aid: carnegie-mellon-university:cert-vulnerability-notes
  name: CERT/CC Vulnerability Notes API
  description: >-
    Public read API for the CERT Coordination Center's Vulnerability Notes database, operated by
    the CERT Division of the Software Engineering Institute — a federally funded research and
    development center operated by Carnegie Mellon University. Returns the full Note record, the
    CVEs a coordination case covers, and the per-vendor status statements CERT/CC collected during
    disclosure. The vendor-statement collection is the machine-readable trace of the coordination
    process itself and has no equivalent anywhere else. kb.cert.org is not a cmu.edu host, which
    is why the cohort audit could not see it: cert.org 301s to sei.cmu.edu, and the sibling Atom
    feed declares its author uri as https://www.sei.cmu.edu.
  humanURL: https://www.kb.cert.org/vuls/
  baseURL: https://kb.cert.org/vuls/api
