apis:
- aid: carnegie-mellon-university:web-login-sso
  name: CMU Web Login (Shibboleth SAML 2.0 Identity Provider)
  description: >-
    Carnegie Mellon's campus-wide single sign-on identity provider, running Shibboleth on CMU's own host
    and address space (login.cmu.edu, 128.2.42.22). Its SAML 2.0 metadata is publicly readable at the
    canonical /idp/shibboleth location, and it is a registered InCommon — and thereby eduGAIN — entity
    carrying the Research & Scholarship entity category, which is a machine-readable commitment to release
    a defined attribute bundle to R&S service providers. An authentication service for relying service
    providers, not a data API, and the single most unambiguously institution-operated machine-readable
    surface CMU publishes.
  humanURL: >-
    https://www.cmu.edu/computing/services/security/identity-access/authentication/sso-provider.html
  baseURL: https://login.cmu.edu/idp/shibboleth
  tags:
  - Identity Federation
  - Authentication
  - SSO
  - Shibboleth
  - SAML
  - InCommon
  x-operator: institution
  properties:
  - type: Documentation
    url: >-
      https://www.cmu.edu/computing/services/security/identity-access/authentication/sso-provider.html
  - type: Metadata
    url: https://mdq.incommon.org/entities/https%3A%2F%2Flogin.cmu.edu%2Fidp%2Fshibboleth
- aid: carnegie-mellon-university:kilthub-figshare-tenant
  name: KiltHub Institutional Repository (figshare) — tenant
  description: >-
    KiltHub is Carnegie Mellon's institutional repository for research data and scholarly output. The
    data, the collections and the DOIs are CMU's; the platform, the API and the OAI-PMH endpoint are figshare's.
    kilthub.cmu.edu is a CNAME to FIGSHARE.COM and answers HTTP 202 with an empty body to non-browser
    clients; its records are harvestable only from figshare's own shared host at https://api.figshare.com/v2/oai
    using set=portal_231, whose Identify response names the repository as "figshare". Recorded as a tenant
    relationship, which is what it is. The eleven figshare-derived contracts this repo carried until 2026-08-19
    — altmetric/articles/authors/collections/institutions/oauth/other/profiles/projects/symplectic — were
    the same vendor document split by tag and credited to CMU eleven times over. They have been removed;
    the relationship has not.
  humanURL: https://kilthub.cmu.edu/
  baseURL: https://api.figshare.com/v2
  tags:
  - Institutional Repository
  - Research Data
  - Open Access
  - Tenant
  x-operator: tenant
  x-vendor: figshare
  x-vendor-evidence: >-
    kilthub.cmu.edu CNAME FIGSHARE.COM (dig, 2026-08-19). OAI-PMH Identify at https://api.figshare.com/v2/oai
    returns repositoryName "figshare"; CMU's content is addressed as set=portal_231.
  properties:
  - type: Documentation
    url: https://kilthub.cmu.edu/
- aid: carnegie-mellon-university:canvas-lti-tenant
  name: Canvas LTI 1.3 Advantage (Instructure) — tenant
  description: >-
    CMU's learning management system serves an LTI 1.3 / LTI Advantage JWKS at canvas.cmu.edu/api/lti/security/jwks,
    so the LTI standard is genuinely in play in CMU's teaching environment. It is recorded as a tenancy
    rather than a CMU surface because canvas.cmu.edu is a CNAME to CMU-VANITY.INSTRUCTURE.COM — the LTI
    implementation, key rotation and contract are Instructure's, running under a CMU vanity hostname.
    The courses and tool deployments behind it are CMU's; the engineering is not. Included because the
    tenancy is a real institutional fact and because it is the only `lti` conformance point on a CMU name.
  humanURL: https://canvas.cmu.edu/
  baseURL: https://canvas.cmu.edu/api/lti
  tags:
  - Learning Management
  - LTI
  - Tenant
  x-operator: tenant
  x-vendor: Instructure
  x-vendor-evidence: canvas.cmu.edu CNAME CMU-VANITY.INSTRUCTURE.COM (dig, 2026-08-19).
  properties:
  - type: Documentation
    url: https://canvas.cmu.edu/
- aid: carnegie-mellon-university:cmu-eats-scottylabs
  name: CMU Eats API (ScottyLabs) — student-operated
  description: >-
    A public JSON API for Carnegie Mellon dining locations, hours and menus, built and run by ScottyLabs,
    a CMU student organization, at api.cmueats.com. It exists because CMU's own dining surface does not:
    apps.studentaffairs.cmu.edu/dining/conceptinfo is a Blazor Server app whose catch-all route returns
    the SPA shell with HTTP 200 for every path, including deliberate nonsense, so there is no institutional
    JSON endpoint to call. Recorded as `tenant` rather than `institution` because the domain is not CMU's
    and no cmu.edu endorsement of the service was found; the data it serves is CMU's, the software is
    not. The older ScottyLabs host dining.apis.scottylabs.org still answers but its payload now instructs
    callers to migrate.
  humanURL: https://cmueats.com/
  baseURL: https://api.cmueats.com/v2
  tags:
  - Campus Life
  - Dining
  - Student Built
  - Tenant
  x-operator: tenant
  x-endorsement: unverified
  properties:
  - type: SourceCode
    url: https://github.com/ScottyLabs
