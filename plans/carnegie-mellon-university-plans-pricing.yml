description: >-
  Carnegie Mellon University is a non-commercial higher-education institution and sells no API
  access. All three surfaces it operates are free and require no registration of any kind: the Delphi
  Epidata API, the CERT/CC Vulnerability Notes API and the Library Publishing Service API were each
  probed anonymously on 2026-08-19 and returned real payloads with no key, token or account. There is
  no signup, no plan page, no quota and no upgrade path, because there is no product. The only
  credentialed access boundary CMU operates is SAML attribute release through Web Login, which gates
  affiliation-scoped services rather than metering an API. Corrected 2026-08-19: the previous version
  described access "typically for non-commercial use", which was figshare's licensing posture read
  onto CMU — none of CMU's own surfaces states a non-commercial restriction.
notes: >-
  No pricing exists to record. "Free / Open" is literal — anonymous and unmetered.
  "Affiliation / Credentialed" is SAML-gated institutional access, not a paid tier.
