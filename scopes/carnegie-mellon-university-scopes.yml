  reason: no_oauth_surface_operated_by_the_institution
description: >-
  Carnegie Mellon University operates no OAuth 2.0 or OpenID Connect authorization server on a
  public, institution-owned API surface, so there are no institution-published scopes to record.
  Both institution-operated public APIs — Delphi Epidata and the CERT/CC Vulnerability Notes API
  — are anonymous and read-only, with no scoped authorization layer of any kind. This file exists
  to state that absence explicitly rather than leave it ambiguous; it is a REWARD-ONLY artifact and
  no scope has been invented to fill it.
scopes: []
authorization_model_in_use_instead:
- model: SAML 2.0 attribute release
  operator: institution
  surface: https://login.cmu.edu/idp/shibboleth
  detail: >-
    CMU's authorization boundary for federated services is SAML attribute release through Web
    Login, governed by the InCommon Research & Scholarship entity category rather than by OAuth
    scopes. R&S commits the IdP to releasing a defined baseline attribute bundle (eduPersonPrincipalName,
    mail, displayName / givenName + sn, eduPersonScopedAffiliation) to R&S-tagged service
    providers. That is the closest thing CMU publishes to a machine-readable permission
    vocabulary, and it is a federation profile, not a scope list.
  evidence:
    url: https://login.cmu.edu/idp/shibboleth
    status: 200
